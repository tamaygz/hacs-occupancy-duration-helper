[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "occupancy-duration-helper"
version = "0.0.0"
description = "Home Assistant custom integration for capability-aware occupancy duration sessions."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "tamaysgz" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "homeassistant>=2026.3.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "pytest-homeassistant-custom-component>=0.13.366",
  "ruff>=0.6.9",
  "mypy>=1.11.2"
]

[tool.setuptools.packages.find]
include = ["custom_components*"]
namespaces = true

# Reserve tests/ as the canonical root for the forthcoming integration test suite.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["custom_components/occupancy_duration"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError"
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "PT", "RUF", "UP"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components", "tests"]
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true