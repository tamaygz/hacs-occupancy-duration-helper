name: Validate

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python compile and metadata validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install development dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Validate pyproject and JSON files
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import tomllib

          root = pathlib.Path('.')
          pyproject = tomllib.loads((root / 'pyproject.toml').read_text(encoding='utf-8'))

          json_files = [
              root / 'hacs.json',
              root / 'custom_components' / 'occupancy_duration' / 'manifest.json',
              root / 'custom_components' / 'occupancy_duration' / 'strings.json',
              root / 'custom_components' / 'occupancy_duration' / 'translations' / 'en.json',
          ]
          parsed_json = {}
          for path in json_files:
            parsed_json[path.name] = json.loads(path.read_text(encoding='utf-8'))

          manifest_version = str(parsed_json['manifest.json']['version'])
          pyproject_version = str(pyproject['project']['version'])
          if manifest_version != pyproject_version:
            raise SystemExit(
              f'version mismatch: manifest.json={manifest_version} pyproject.toml={pyproject_version}'
            )
          print('metadata OK')
          PY

      - name: Compile integration and tests
        shell: bash
        run: |
          python -m py_compile custom_components/occupancy_duration/*.py
          python -m py_compile tests/*.py

      - name: Run pytest
        shell: bash
        run: |
          pytest

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master