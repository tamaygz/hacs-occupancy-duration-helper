name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without or with a leading v, for example 0.1.1
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Bump, tag, and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Enforce main branch releases
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Releases must be cut from main, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Ensure tag does not already exist
        shell: bash
        run: |
          TAG_INPUT="${{ github.event.inputs.version }}"
          NORMALIZED_TAG="${TAG_INPUT#v}"
          if git rev-parse "v${NORMALIZED_TAG}" >/dev/null 2>&1; then
            echo "Tag v${NORMALIZED_TAG} already exists" >&2
            exit 1
          fi

      - name: Install development dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Normalize and apply release version
        id: bump
        shell: bash
        run: |
          python scripts/release.py "${{ github.event.inputs.version }}" --write
          VERSION=$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/occupancy_duration/manifest.json').read_text(encoding='utf-8'))
          print(manifest['version'])
          PY
          )
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate bumped metadata and source tree
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import tomllib

          root = pathlib.Path('.')
          pyproject = tomllib.loads((root / 'pyproject.toml').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'custom_components' / 'occupancy_duration' / 'manifest.json').read_text(encoding='utf-8'))
          if str(pyproject['project']['version']) != str(manifest['version']):
              raise SystemExit('manifest.json and pyproject.toml versions are out of sync')
          print('version metadata OK')
          PY
          python -m py_compile custom_components/occupancy_duration/*.py
          python -m py_compile tests/*.py
          pytest

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

      - name: Commit release version bump
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No version changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml custom_components/occupancy_duration/manifest.json
          git commit -m "Release ${{ steps.bump.outputs.tag }}"

      - name: Push release commit and tag
        shell: bash
        run: |
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin HEAD
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.prerelease }}